<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagina non trovata — Bodytech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --red: #e30613; --ink: #16181d; --muted: #6b7079; --bg: #f5f5f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif; padding: 24px; text-align: center; }
    img { height: 34px; width: auto; margin-bottom: 40px; }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); margin: 0 0 12px; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0 0 28px; font-size: 1.1rem; }
    a.btn { display: inline-block; background: var(--red); color: #fff; text-decoration: none; font-weight: 700; padding: 14px 26px; border-radius: 999px; margin: 4px; }
    a.btn--ghost { background: #fff; color: var(--ink); border: 2px solid #e6e7ea; }
  </style>
</head>
<body>
  <main>
    <img src="https://www.bodytech.it/wp-content/uploads/2020/10/bodytech-logo-small-pc.png" alt="Bodytech">
    <h1>Pagina non trovata</h1>
    <p>La pagina che cerchi non esiste o è stata spostata.</p>
    <!-- link relativi alla radice del sito (funzionano anche in una sottocartella di GitHub Pages) -->
    <a class="btn" href="./" id="home">Torna alla home</a>
    <a class="btn btn--ghost" href="./prodotti.html" id="prod">Vai ai prodotti</a>
  </main>
  <script>
    // su GitHub Pages il sito vive in /<nome-repository>/: i link puntano lì
    const base = location.pathname.split("/").filter(Boolean)[0];
    if (location.hostname.endsWith("github.io") && base) {
      document.getElementById("home").href = "/" + base + "/";
      document.getElementById("prod").href = "/" + base + "/prodotti.html";
    }
  </script>
</body>
</html>
